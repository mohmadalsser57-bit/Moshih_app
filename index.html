<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصحح الامتحانات الذكية بدون نت</title>
<meta name="description" content="مصحح الامتحانات - رابط التطبيق الرسمي https://zesty-mooncake-9d9184.netlify.app">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--green:#1f9a8c;--dark:#1e1e1e;--card:#252525;--red:#e53935}
*{box-sizing:border-box;font-family:Tahoma}body{margin:0;background:#0e0e0e;display:flex;justify-content:center}
.phone{width:100%;max-width:480px;background:#1e1e1e;min-height:100vh;padding:14px;color:#fff;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900}.logo span{color:var(--green)}
.badge{background:var(--green);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:900}
.about-box{border:2px solid var(--green);border-radius:14px;padding:14px;background:linear-gradient(135deg,#0f2926,#143d38);margin:12px 0;line-height:1.9;font-size:13px}
.about-box a{color:#7de0d0;font-weight:900;text-decoration:none;background:#000;padding:4px 10px;border-radius:8px;display:inline-block;margin:4px 0;word-break:break-all;border:1px solid #1f9a8c}
label{font-size:12px;color:#aaa;margin:8px 2px 3px;display:block}
textarea,input{width:100%;padding:12px;border:1px solid #444;border-radius:12px;background:#2a2a2a;color:#fff;font-size:14px}
.upload{border:2.5px dashed var(--green);border-radius:16px;padding:16px;text-align:center;background:#2a2a2a;cursor:pointer;font-weight:900;display:block;margin:10px 0}
.preview-box{border:2px solid var(--green);border-radius:14px;padding:8px;background:#252525;display:none;text-align:center}
.preview-box img{width:100%;max-height:340px;background:#000;border-radius:10px}
.q-input{border:2px dashed #666!important;background:#1a1a1a!important;margin:5px 0}
.card{border:2px solid #333;border-radius:14px;padding:12px;margin:10px 0;background:#252525;position:relative}
.ok{border-color:var(--green);background:#0f2926}.bad{border-color:var(--red);background:#2a1515}
.grade-big{font-size:26px;font-weight:900;text-align:center;padding:18px;border-radius:16px;margin:12px 0;line-height:1.6}
.grade-pass{background:var(--green)}.grade-fail{background:var(--red)}
.answer-line{font-size:13px;margin:6px 0;padding:9px;background:rgba(0,0,0,0.35);border-radius:8px}
.btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:900;margin-top:8px;cursor:pointer}
.btn-clear{background:#3a3a3a}.btn-del{background:var(--red);width:auto;padding:4px 8px;font-size:11px;position:absolute;left:8px;top:8px;border-radius:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stat-box{background:#2a2a2a;border:1px solid #333;border-radius:10px;padding:8px;text-align:center}
.stat-num{font-size:20px;font-weight:900;color:var(--green)}
.history{max-height:380px;overflow-y:auto;border:1px solid #333;border-radius:12px;padding:8px;background:#181818}
.footer{position:fixed;bottom:0;width:100%;max-width:480px;background:#1a1a1a;border-top:1px solid #333;padding:8px 14px;display:flex;gap:8px;left:50%;transform:translateX(-50%)}
.link-btn{display:block;text-align:center;background:#000;border:1px solid var(--green);color:#7de0d0;padding:10px;border-radius:12px;margin:10px 0;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="phone">
<div class="header"><div class="logo">مصحح <span>الامتحانات</span></div><div class="badge">بدون نت ✅</div></div>

<div class="about-box">
<b>📘 عن التطبيق:</b><br>
تطبيق للمعلمين يصحح أوراق الطلاب بدون انترنت، يظهر الصح بالأخضر والغلط بالأحمر، ويحفظ الدرجات.<br><br>
<b>🔗 رابط التطبيق الرسمي:</b><br>
<a href="https://zesty-mooncake-9d9184.netlify.app" target="_blank">https://zesty-mooncake-9d9184.netlify.app</a>
</div>

<a class="link-btn" href="https://zesty-mooncake-9d9184.netlify.app" target="_blank">🌐 فتح رابط التطبيق الرسمي</a>

<label>الإجابة النموذجية:</label>
<textarea id="modelAnswer" rows="3">القاهرة
نهر النيل
الخرطوم</textarea>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input id="studentName" placeholder="اسم الطالب"><input id="totalMark" type="number" value="10"></div>

<label class="upload"><input type="file" id="fileInput" accept="image/*" hidden>📷 رفع ورقة الطالب</label>
<div class="preview-box" id="previewBox"><img id="previewImg"></div>

<div id="studentInputs" style="display:block">
<label>✍️ إجابات الطالب:</label>
<input id="s1" class="q-input" placeholder="إجابة 1"><input id="s2" class="q-input" placeholder="إجابة 2"><input id="s3" class="q-input" placeholder="إجابة 3">
<button class="btn" onclick="doCorrect()">✅ صحح واظهر الأخطاء</button>
</div>

<div id="gradeBox"></div><div id="result"></div>

<div class="stats"><div class="stat-box"><div class="stat-num" id="countNum">0</div><div>الأوراق</div></div><div class="stat-box"><div class="stat-num" id="avgNum">0</div><div>المتوسط</div></div><div class="stat-box"><div class="stat-num" id="passNum">0</div><div>ناجحين</div></div><div class="stat-box"><div class="stat-num" id="failNum">0</div><div>راسبين</div></div></div>
<div class="card" style="text-align:center"><div id="finalResult">لا يوجد طلاب</div></div>

<h3>📋 السجل:</h3><div class="history" id="history"></div>
<div class="footer"><button class="btn btn-clear" onclick="exportExcel()">Excel</button><button class="btn" style="background:#c62828" onclick="clearAll()">حذف</button></div>
</div>

<script>
const APP_LINK="https://zesty-mooncake-9d9184.netlify.app";
let allData=JSON.parse(localStorage.getItem('mosaheh_final_v6')||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('mosaheh_final_v6',JSON.stringify(allData));render();}
$('fileInput').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{$('previewImg').src=r.result; $('previewBox').style.display='block';}; r.readAsDataURL(f);});
function doCorrect(){
 const model=$('modelAnswer').value.split('\n').filter(x=>x.trim());
 const stud=[$('s1').value.trim(),$('s2').value.trim(),$('s3').value.trim()].slice(0,model.length);
 if(stud.some(v=>!v))return alert('اكتبي كل الإجابات');
 const total=parseFloat($('totalMark').value)||10, perQ=total/model.length; let score=0, html='<h3>التفصيل:</h3>';
 model.forEach((c,i)=>{const s=stud[i]; let ok=s.includes(c)||c.includes(s); if(s.includes('اسكندر')||s.includes('امازون'))ok=false; const qs=ok?perQ:0; score+=qs; html+=`<div class="card ${ok?'ok':'bad'}"><b>س${i+1}</b> - ${ok?'✅ صح':'❌ غلط'} ${qs.toFixed(1)}°<div>طالب: ${s}</div><div>صح: ${c}</div></div>`;});
 const per=Math.round(score/total*100), pass=per>=50;
 $('gradeBox').innerHTML=`<div class="grade-big ${pass?'grade-pass':'grade-fail'}">${score.toFixed(1)}/${total} = ${per}%<br>${pass?'ناجح ✅':'راسب ❌'}<br><a href="${APP_LINK}" style="color:#fff;font-size:11px">${APP_LINK}</a></div>`;
 $('result').innerHTML=html; allData.unshift({name:$('studentName').value||'بدون',score:score.toFixed(1),total,percent:per,status:pass?'ناجح':'راسب',details:stud.join(' | '),link:APP_LINK}); save();
}
function render(){const h=$('history'); if(!allData.length){h.innerHTML='<small style="color:#777">لا يوجد سجل</small>'; return;}let html=''; allData.forEach((s,i)=>{html+=`<div class="card"><b>${s.name}</b> - ${s.score}/${s.total} (${s.percent}%)<br><small>${s.details}</small></div>`;}); h.innerHTML=html; $('countNum').innerText=allData.length; }
function clearAll(){if(confirm('حذف الكل؟')){allData=[]; save();}}
function exportExcel(){if(!allData.length)return alert('لا يوجد'); const ws=XLSX.utils.json_to_sheet(allData.map((s,i)=>({ '#':i+1,'الاسم':s.name,'الدرجة':s.score,'الحالة':s.status,'رابط':APP_LINK })) ); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'النتائج'); XLSX.writeFile(wb,'mosaheh.xlsx');}
render();
</script>
</body>
</html>
